# Deploy the Astro site in portfolio/ to GitHub Pages.
# Vercel keeps deploying the same code independently — no conflict.
#
# Required repo setup (once, on github.com):
#   1. Repo MUST be named exactly `warquahf.github.io` under user `warquahf`
#      for the URL https://warquahf.github.io (user site). Easiest: rename the
#      current repo (Settings → General → Repository name). Vercel follows
#      renames automatically, so the .vercel.app deployment keeps working.
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   3. Push to main — this workflow builds portfolio/ and publishes dist/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # SITE_URL defaults to https://warquahf.github.io in astro.config.mjs,
        # so no env override is needed for the Pages build.
        # GH_CONTRIB_TOKEN (optional repo secret) feeds the build-time GitHub
        # GraphQL call in Overview.astro; without it the calendar renders empty.
        env:
          GH_CONTRIB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
